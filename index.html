<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勤怠管理ツール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>勤怠管理ツール</h1>
      <p>日々の勤怠記録を登録・管理できる業務改善ツール</p>
    </header>

    <section class="form-section">
      <h2>勤怠登録</h2>
      <form id="attendanceForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="date">日付</label>
            <input type="date" id="date" required>
          </div>

          <div class="form-group">
            <label for="name">氏名</label>
            <input type="text" id="name" placeholder="例：内藤竜飛" required>
          </div>

          <div class="form-group">
            <label for="clockIn">出勤時間</label>
            <input type="time" id="clockIn" required>
          </div>

          <div class="form-group">
            <label for="clockOut">退勤時間</label>
            <input type="time" id="clockOut" required>
          </div>

          <div class="form-group">
            <label for="breakTime">休憩時間（分）</label>
            <input type="number" id="breakTime" placeholder="60" min="0" required>
          </div>

          <div class="form-group">
            <label for="note">備考</label>
            <input type="text" id="note" placeholder="例：午前会議あり">
          </div>
        </div>

        <button type="submit" class="add-button">登録する</button>
      </form>
    </section>

    <section class="filter-section">
      <h2>検索</h2>
      <div class="filter-box">
        <input type="text" id="searchInput" placeholder="氏名で検索">
        <button id="resetButton">全件表示</button>
      </div>
    </section>

    <section class="summary-section">
      <h2>月間集計</h2>
      <div class="summary-cards">
        <div class="summary-card">
          <h3>登録件数</h3>
          <p id="totalCount">0</p>
        </div>
        <div class="summary-card">
          <h3>総実働時間</h3>
          <p id="totalWorkTime">0時間</p>
        </div>
        <div class="summary-card">
          <h3>平均実働時間</h3>
          <p id="averageWorkTime">0時間</p>
        </div>
      </div>
    </section>

    <section class="list-section">
      <h2>勤怠一覧</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th>氏名</th>
              <th>出勤</th>
              <th>退勤</th>
              <th>休憩</th>
              <th>実働時間</th>
              <th>備考</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="attendanceList"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
